<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="546px" preserveAspectRatio="none" style="width:863px;height:546px;background:#FFFFFF;" version="1.1" viewBox="0 0 863 546" width="863px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="324.9053" x="265.5479" y="22.9951">PWasm Persistence Backend Capabilities</text></g><g class="legend" data-source-line="7"><rect fill="#DDDDDD" height="176.9688" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="832.001" x="12" y="49.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.9707" x="17" y="67.292">Backend capability matrix</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="9.748" x="17" y="85.5889">&#160;&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="115.165" x="207.5176" y="85.5889">VolatileRegion</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="151.6006" x="365.3184" y="85.5889">PmemMmapRegion</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="131.3252" x="607.8096" y="85.5889">FileMmapRegion</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="127.7295" x="17" y="101.8857">backend name()</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="144.7295" y="101.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.0801" x="207.0938" y="101.8857">"volatile"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.6543" x="364.8945" y="101.8857">"pmem"</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="34.2002" x="607.3857" y="101.8857">"file"</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="106.9004" x="17" y="118.1826">isPersistent()</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="123.9004" y="118.1826">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.3047" x="207.0938" y="118.1826">false</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.7314" x="364.8945" y="118.1826">true</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="28.7314" x="607.3857" y="118.1826">true</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="134.1826" x="17" y="134.4795">checkpointCost()</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="151.1826" y="134.4795">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="35.4717" x="207.0938" y="134.4795">FREE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.168" x="364.8945" y="134.4795">CHEAP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.6357" x="607.3857" y="134.4795">EXPENSIVE</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="61.8652" x="17" y="150.7764">backing</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="78.8652" y="150.7764">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.6865" x="207.0938" y="150.7764">Array&lt;byte&gt; (GC)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.4619" x="364.8945" y="150.7764">mmap MAP_SYNC (PMEM/DAX)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.4688" x="607.3857" y="150.7764">mmap file (block device)</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="85.5791" x="17" y="167.0732">fresh=true</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="102.5791" y="167.0732">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.9004" x="207.0938" y="167.0732">new Array is zero-init</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.3574" x="364.8945" y="167.0732">O_TRUNC + zero-fill</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.3574" x="607.3857" y="167.0732">O_TRUNC + zero-fill</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="181.1934" x="17" y="183.3701">prepareChangedRange</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="198.1934" y="183.3701">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0479" x="207.0938" y="183.3701">no-op (true)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.5908" x="364.8945" y="183.3701">flushRange (CLWB*), set pending</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.3711" x="607.3857" y="183.3701">mark hasDirtyChanges</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="122.083" x="17" y="199.667">persistChanges</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="139.083" y="199.667">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0479" x="207.0938" y="199.667">no-op (true)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229.4482" x="364.8945" y="199.667">storeFence (SFENCE*) if pending</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.377" x="607.3857" y="199.667">fdatasync(fd) if dirty</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="104.2891" x="17" y="215.9639">persistRange</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="121.2891" y="215.9639">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0479" x="207.0938" y="215.9639">no-op (true)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.7363" x="364.8945" y="215.9639">flushRange + storeFence</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.165" x="607.3857" y="215.9639">pageAlignedSyncRange (msync)</text><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="72.5938" y2="72.5938"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="88.8906" y2="88.8906"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="105.1875" y2="105.1875"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="121.4844" y2="121.4844"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="137.7813" y2="137.7813"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="154.0781" y2="154.0781"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="170.375" y2="170.375"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="186.6719" y2="186.6719"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="202.9688" y2="202.9688"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="839.001" y1="219.2656" y2="219.2656"/><line style="stroke:#000000;stroke-width:1;" x1="17" x2="17" y1="72.5938" y2="219.2656"/><line style="stroke:#000000;stroke-width:1;" x1="202.6436" x2="202.6436" y1="72.5938" y2="219.2656"/><line style="stroke:#000000;stroke-width:1;" x1="360.4443" x2="360.4443" y1="72.5938" y2="219.2656"/><line style="stroke:#000000;stroke-width:1;" x1="602.9355" x2="602.9355" y1="72.5938" y2="219.2656"/><line style="stroke:#000000;stroke-width:1;" x1="839.001" x2="839.001" y1="72.5938" y2="219.2656"/></g><g class="entity" data-qualified-name="GMN1" data-source-line="21" id="ent0002"><path d="M194.8435,305.2656 L194.8435,511.9922 A0,0 0 0 0 194.8435,511.9922 L659.1575,511.9922 A0,0 0 0 0 659.1575,511.9922 L659.1575,315.2656 L649.1575,305.2656 L431.0035,305.2656 L427.0035,265.7356 L423.0035,305.2656 L194.8435,305.2656 A0,0 0 0 0 194.8435,305.2656" fill="#FFF8DC" style="stroke:#999999;stroke-width:0.5;"/><path d="M649.1575,305.2656 L649.1575,315.2656 L659.1575,315.2656 L649.1575,305.2656" fill="#FFF8DC" style="stroke:#999999;stroke-width:0.5;"/><ellipse cx="206.3435" cy="317.8984" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="387.9497" x="212.8435" y="322.3325">PMEM flushRange/storeFence (CLWB/SFENCE) are currently</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.7783" x="200.8435" y="337.4653">no-op stubs (MmapRegionUtils) pending Virgil inline-asm;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="443.314" x="200.8435" y="352.5981">PMEM durability is not yet functional. See ROADMAP Next Steps #2.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="200.8435" y="367.731">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.1475" x="200.8435" y="382.8638">checkpointCost() drives the WAL's per-backend checkpoint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.4243" x="200.8435" y="397.9966">thresholds: FREE checkpoints on nearly every commit,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="393.6182" x="200.8435" y="413.1294">EXPENSIVE checkpoints lazily. Unknown backends default to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="76.2227" x="200.8435" y="428.2622">EXPENSIVE.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="200.8435" y="443.395">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.5752" x="200.8435" y="458.5278">prepareChangedRange/persistChanges is the two-phase data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.8833" x="200.8435" y="473.6606">path (used by applyUpdate + maybeCheckpoint); persistRange</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="388.6733" x="200.8435" y="488.7935">is the synchronous ordered path (used for WAL records and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.8936" x="200.8435" y="503.9263">superblock writes).</text></g><g class="start_entity" data-qualified-name="start" data-source-line="21" id="ent0003"><ellipse cx="427.0035" cy="255.2656" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="caption" data-source-line="5"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="405.0361" x="225.4824" y="534.9873">Durability semantics per BackendRegion implementation.</text></g><?plantuml-src ZLHHRzis47xdhxXr3vFJs0uyjydMD83hADk09ZNi9UcU2eewsOGfaY2ff0hyutkKPCiTEc0FDkqxtlTzHtx7dwGMgieHVAWLZcnLAiQ230fXySXz2GjqNlg0MY1yu6ABEeSvjpoJIWQ9dWbkWpGQ7kKBTpcaUYqrWZ1bAGDSP9Etas8g9jFfR-TPFX5lU8Q_dejfTZ4LqxCydtAA5nUdC3cRl1sUdG_F9gC3v7NbMfuQF9PS1oayM7Hx8KjSnssoj0fBr877gX5Z2jTHPZ2MxIMBlUGQIXwS_Cfsxm7eys0KbIdii2YoAB6yBRdj8pUKFuwmtMLsbNN8cfUO32x7sHNiuDLJ1_Sg_h64rFmesaXJ9_tXICEXhk3A8wt1LVtIR1SR55jhf0vpu_k2csMQqZB_CvqjQ4q_BzAxrLyFwP4ugTVTvfbplBxCwe1NaFmn7r2ef7RWThRuilhdRWx9uZQz7L_FFXzIKJ4acJ9Y2pa-IO633hfmw3Vley8ENUDpom3ImmiwCvIQhdu7dxxylRmdzDTjb23LVqKRPElGSeVp3TThp9VnUqzXXiP24acZma9LVjFa8Pb_VFnmCZWbWmIoXiwfwzW3TrlOS7yjNQXRGBzdQK-_2_wOm0VZyARnVBAwIU_cwSa0P754KEGyS5zhaHHvayeZq_SK_w-3ryTiEx1yZJCbrnhp5S5tNPQHAju02MZTpPWs0I4p8PYIdK2ymIFOyN4ByOp6RHy3e1C6KJb7zbCrQtNvK6KUajxZz-HXFpZq-o3TMYgGMj5i3-bPUCSQlhmVKBfx4WGrNKDHQH4daQiHh11X-MbsJLQ3E_mQO1NGUlYPffpzszgGE_b4znGs28-pZxyqipxSprc_cuLDzA1HkV-z7OG-vu46L2DtgWPyGbTtBz4fwqVaUBVYBrBL8xZNMssUDNHidanVy4e5UaJwIjBy0u-EltTKF8dOGNWsGqiMH8XMOPQ73IILnnoo6hYrghwtb8a6A7cT4UHUrU0T73k8TO3H0XjdjAceIPUZ8wWZrCAuU6hWK53M0oUF-8g0sY5-TZAW7unOysQHTTWt?></g></svg>